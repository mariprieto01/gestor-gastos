apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: gestor-gastos
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [default]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: gestor-gastos
          - source_labels: [__meta_kubernetes_pod_label_version]
            target_label: version
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "${1}:8000"
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
  alerts.yml: |
    groups:
      - name: gestor-gastos
        rules:
          - alert: DemasiadosGastosEnCategoria
            expr: sum by (categoria) (increase(gastos_creados_total[5m])) > 5
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Pico de gastos en la categoria {{ $labels.categoria }}"
              description: "Se crearon {{ $value }} gastos en la categoria {{ $labels.categoria }} en los ultimos 5 minutos (umbral: 5)."